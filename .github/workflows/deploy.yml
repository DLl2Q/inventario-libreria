name: Deploy a GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar configuración (Supabase y contraseña de acceso)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY en el repositorio." >&2
            exit 1
          fi
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g" assets/js/config.js
          sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g" assets/js/config.js

          if [ -n "${LOGIN_PASSWORD:-}" ]; then
            LOGIN_PASSWORD_HASH=$(printf '%s' "${LOGIN_PASSWORD}" | sha256sum | cut -d' ' -f1)
            sed -i "s|__LOGIN_PASSWORD_HASH__|${LOGIN_PASSWORD_HASH}|g" assets/js/config.js
          else
            echo "Aviso: no se configuró el secreto LOGIN_PASSWORD; el sitio quedará sin protección por contraseña." >&2
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
