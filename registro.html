<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar producto</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn" href="index.html">&larr; Volver al inventario</a>
    <h1>Registrar producto</h1>
    <button id="logout-btn" class="btn" type="button">Cerrar sesión</button>
  </header>

  <main class="container">
    <form id="form-producto" class="form-card">
      <div class="form-group">
        <label for="fecha">Fecha de compra</label>
        <input type="date" id="fecha" name="fecha" required />
      </div>

      <div class="form-group">
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" name="cantidad" min="0.01" step="any" placeholder="Ej. 3" required />
      </div>

      <div class="form-group">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" name="empresa" placeholder="Ej. TaiLoy" required />
      </div>

      <div class="form-group">
        <label for="descripcion">Producto</label>
        <input type="text" id="descripcion" name="descripcion" placeholder="Ej. Cuaderno ATLAS A4" required />
      </div>

      <div class="form-group">
        <label for="precio_compra">Precio compra total (S/)</label>
        <input type="number" id="precio_compra" name="precio_compra" min="0" step="0.01" placeholder="Ej. 45.90" required />
      </div>

      <div id="form-message" class="form-message" role="status"></div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Guardar producto</button>
    </form>
  </main>

  <script type="module" src="assets/js/registro.js"></script>
</body>
</html>
